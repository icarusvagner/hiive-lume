[workspace]
resolver = "2"
members = [
	"crates/gui",			# GUI layer using gpui
	"crates/app",			# App orchestrator + state
	"crates/core",			# Domain logic
	"crates/store",			# Database layer with SQLx + SeaQuery
	"crates/tools",			# Utilities and shared helpers
	"crates/ui-components",		# Reusable gpui-components
	"crates/svc-sync",		# Sync engine: remote API client, background sync
	"crates/svc-auth",		# Auth, token storage, oauth helpers
]
exclude = [
	"tests/integration",		# Integration tests
	"tests/ui"			# UI snapshot tests
]

[workspace.package]
edition = "2024"
description = "Hiive Lume is a next‑generation desktop Human Resource & Operations Management system built using Rust, gpui, and gpui-component. Inspired by Morphiq Lume but architected for a fully declarative, component‑driven UI, Hiive Lume delivers a fast, clean, and modern HR experience."
authors = ["devixion", "icarusvagner <ruthakaza@gmail.com>", "lanphil <lanphil2000@proton.me>"]

[workspace.dependencies]
modql = {version = "0.4.1", features = ["with-sea-query"] }
sea-query = "0.32.7"
sqlx = { version = "0.8.6", features = ["macros", "runtime-tokio", "postgres", "uuid"] }
sea-query-binder = { version = "0.7.0", features = ["sqlx-postgres", "with-uuid", "with-time"] }
time = { version = "0.3", features = ["formatting", "serde", "parsing"] }
strum = { version = "0.27.2", features = ["derive"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing = "0.1.43"
thiserror = "2.0.17"
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
gpui = "0.2.2"
gpui-component = { version = "0.5.0", features = ["tree-sitter-languages"] }
mockd = { version = "0.4.55", features = ["image", "job", "name", "company", "address"] }
rand = "0.9.2"
rust-embed = { version = "8.9.0", features = ["interpolate-folder-path"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.89"
reqwest = { version = "0.12.15-zed", package = "zed-reqwest" }
derive_more = { version = "2.0.1", features = ["from", "display"] }
serde_with = { version = "3.16.0", features = ["time_0_3"] }
pq-sys = { version = "0.7.5", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.18.1", features = ["fast-rng", "v7", "v4", "serde"] }
rustls = "0.23.35"
rustls-platform-verifier = "0.6.2"
regex = "1.12.2"
log = "0.4.29"
bytes = "1.11.0"
futures = "0.3.31"
hmac = "0.12.1"
sha2 = "0.10.9"
blake3 = "1.8.2"
argon2 = { version = "0.5.3", features = ["std"] }
lazy-regex = "3.4.2"
enum_dispatch = "0.3.13"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
