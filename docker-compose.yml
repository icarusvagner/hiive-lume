services:
  database-diesel:
    container_name: database-diesel
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diesel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P4sswrd}
      POSTGRES_USER: ${POSTGRES_USER:-diesel}
    ports:
      - "5432:5432"
    volumes:
      - db-diesel:/var/lib/postgres/data:rw
  diesel-learn:
    container_name: pixl8-media
    stdin_open: true
    tty: true
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-diesel}:${POSTGRES_PASSWORD:-P4sswrd}@database-diesel/${POSTGRES_DB:-diesel}
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - ./:/pixl8-media
      - pixl8-media-target:/diesel/target
    depends_on:
      - database-diesel

volumes:
  # postgres data
  db-diesel:
  # rust data
  pixl8-media-target:
